<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrgChart Maker</title>
<style>
:root {
  --bg: #f0f2f5;
  --surface: #ffffff;
  --surface2: #f8f9fb;
  --border: #e2e8f0;
  --text: #1a202c;
  --text-muted: #718096;
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --danger: #ef4444;
  --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.05);
  --shadow-lg: 0 10px 15px rgba(0,0,0,.1), 0 4px 6px rgba(0,0,0,.05);
  --r: 8px;
  --r-lg: 12px;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 14px;
}

/* ── Header ─────────────────────────────────────── */
#header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  height: 54px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  box-shadow: var(--shadow);
  z-index: 100;
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 17px;
  font-weight: 700;
  color: var(--primary);
  margin-right: 6px;
}

.sep { flex: 1; }

.divider {
  width: 1px;
  height: 24px;
  background: var(--border);
  margin: 0 4px;
}

/* ── Buttons ─────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 13px;
  border-radius: var(--r);
  border: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  line-height: 1;
  transition: background .12s, box-shadow .12s;
  white-space: nowrap;
  font-family: inherit;
}
.btn svg { flex-shrink: 0; }
.btn-primary  { background: var(--primary); color: #fff; }
.btn-primary:hover  { background: var(--primary-hover); }
.btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--surface2); }
.btn-danger   { background: var(--danger); color: #fff; }
.btn-danger:hover   { background: #dc2626; }
.btn-ghost    { background: transparent; color: var(--text-muted); }
.btn-ghost:hover    { background: var(--surface2); color: var(--text); }
.btn-icon { padding: 7px; }

/* ── Canvas area ─────────────────────────────────── */
#canvas-wrap {
  flex: 1;
  overflow: hidden;
  position: relative;
  background-color: var(--bg);
  background-image: radial-gradient(circle, #c7d0de 1px, transparent 1px);
  background-size: 24px 24px;
  cursor: grab;
  touch-action: none;
}
#canvas-wrap.panning { cursor: grabbing; }

#canvas {
  position: absolute;
  top: 0; left: 0;
  transform-origin: 0 0;
  will-change: transform;
}

#svg-layer {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
  overflow: visible;
}

#nodes-layer { position: absolute; top: 0; left: 0; }

/* ── Node card ───────────────────────────────────── */
.nc {
  position: absolute;
  width: 210px;
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-md);
  border: 2px solid transparent;
  cursor: default;
  transition: box-shadow .15s, border-color .15s, transform .1s;
  user-select: none;
}
.nc:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.nc.selected { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79,70,229,.12), var(--shadow-lg); }

.nc-bar { height: 5px; border-radius: var(--r-lg) var(--r-lg) 0 0; }

.nc-body { padding: 11px 13px 9px; display: flex; align-items: flex-start; gap: 10px; }

.nc-avatar {
  width: 38px; height: 38px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; color: #fff;
  flex-shrink: 0;
}

.nc-info { flex: 1; min-width: 0; }
.nc-name  { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nc-title { font-size: 11px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nc-dept  {
  display: inline-block; font-size: 10px; font-weight: 500;
  padding: 2px 7px; border-radius: 20px; margin-top: 5px;
}

.nc-actions {
  display: flex; gap: 3px; align-items: center;
  padding: 5px 8px;
  border-top: 1px solid var(--border);
  opacity: 0; transition: opacity .15s;
}
.nc:hover .nc-actions { opacity: 1; }
@media (hover: none) { .nc-actions { opacity: 1; } }

.nc-btn {
  display: flex; align-items: center; justify-content: center;
  width: 26px; height: 26px;
  border-radius: 6px; border: none; cursor: pointer;
  background: transparent; color: var(--text-muted);
  transition: background .1s, color .1s;
}
.nc-btn:hover        { background: var(--surface2); color: var(--text); }
.nc-btn.add:hover    { background: #ede9fe; color: var(--primary); }
.nc-btn.danger:hover { background: #fee2e2; color: var(--danger); }
.nc-btn-label { font-size: 10px; font-weight: 600; color: var(--text-muted); flex: 1; text-align: right; padding-right: 4px; }

/* ── Connection lines ────────────────────────────── */
.conn { fill: none; stroke: #c1cad6; stroke-width: 2; }

/* ── Zoom controls ───────────────────────────────── */
#zoom-ctrl {
  position: absolute;
  bottom: 18px; right: 18px;
  display: flex; flex-direction: column; gap: 4px; align-items: center;
  z-index: 50;
}
.z-btn {
  width: 32px; height: 32px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 300; color: var(--text);
  box-shadow: var(--shadow); transition: background .1s;
  font-family: inherit;
}
.z-btn:hover { background: var(--surface2); }
#zoom-pct {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 3px 8px;
  font-size: 11px; font-weight: 500; color: var(--text-muted);
  box-shadow: var(--shadow); text-align: center;
}

/* ── Empty state ─────────────────────────────────── */
#empty {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center; color: var(--text-muted);
  pointer-events: none;
}
#empty h2 { font-size: 19px; font-weight: 600; color: var(--text); margin: 12px 0 6px; }
#empty p  { font-size: 14px; }

/* ── Modal ───────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 900;
  opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
.overlay.open { opacity: 1; pointer-events: auto; }

.modal {
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: 0 25px 60px rgba(0,0,0,.18);
  width: 420px; max-width: calc(100vw - 24px);
  transform: scale(.95) translateY(8px);
  transition: transform .2s;
}
.overlay.open .modal { transform: scale(1) translateY(0); }

.modal-head {
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-head h2 { font-size: 16px; font-weight: 600; }
.modal-close {
  background: none; border: none; cursor: pointer;
  color: var(--text-muted); padding: 4px; border-radius: 6px;
  display: flex; align-items: center; line-height: 0;
}
.modal-close:hover { background: var(--surface2); color: var(--text); }

.modal-body { padding: 18px 22px; }
.modal-foot {
  padding: 14px 22px;
  border-top: 1px solid var(--border);
  display: flex; gap: 8px; justify-content: flex-end;
}

.fg { margin-bottom: 14px; }
.fg:last-child { margin-bottom: 0; }
.flabel {
  display: block; font-size: 12px; font-weight: 500;
  margin-bottom: 5px; color: var(--text);
}
.flabel .opt { font-weight: 400; color: var(--text-muted); }
.finput, .fselect {
  width: 100%; padding: 8px 11px;
  border: 1px solid var(--border); border-radius: var(--r);
  font-size: 13px; color: var(--text); background: var(--surface);
  outline: none; font-family: inherit;
  transition: border-color .15s, box-shadow .15s;
}
.finput:focus, .fselect:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79,70,229,.1);
}
.finput.error { border-color: var(--danger); }

.swatches { display: flex; gap: 7px; flex-wrap: wrap; }
.swatch {
  width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent;
  transition: transform .1s, border-color .1s;
}
.swatch:hover   { transform: scale(1.15); }
.swatch.active  { border-color: #1a202c; transform: scale(1.15); }

/* ── Context menu ────────────────────────────────── */
#ctxmenu {
  position: fixed;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); box-shadow: var(--shadow-lg);
  z-index: 800; min-width: 165px; padding: 4px;
  display: none;
}
#ctxmenu.open { display: block; }
.cxi {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 11px; border-radius: 6px; cursor: pointer;
  font-size: 13px; color: var(--text); transition: background .1s;
}
.cxi:hover          { background: var(--surface2); }
.cxi.d             { color: var(--danger); }
.cxi.d:hover       { background: #fee2e2; }
.cxsep { height: 1px; background: var(--border); margin: 4px 0; }

/* ── Confirm dialog ──────────────────────────────── */
#confirm {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.45);
  display: none; align-items: center; justify-content: center;
  z-index: 1000;
}
#confirm.open { display: flex; }
.cfbox {
  background: var(--surface); border-radius: var(--r-lg);
  padding: 24px; max-width: 370px; width: calc(100vw - 24px);
  box-shadow: 0 25px 60px rgba(0,0,0,.18);
}
.cfbox h3 { font-size: 16px; font-weight: 600; margin-bottom: 7px; }
.cfbox p  { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
.cfbtns   { display: flex; gap: 8px; justify-content: flex-end; }

/* ── Toast ───────────────────────────────────────── */
#toasts {
  position: fixed; bottom: 16px; left: 50%;
  transform: translateX(-50%);
  z-index: 2000;
  display: flex; flex-direction: column; gap: 6px; align-items: center;
  pointer-events: none;
}
.toast {
  background: #1a202c; color: #fff;
  padding: 9px 16px; border-radius: var(--r);
  font-size: 13px; box-shadow: var(--shadow-lg);
  animation: tIn .18s ease, tOut .25s ease 2.4s forwards;
  white-space: nowrap;
}
@keyframes tIn  { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
@keyframes tOut { to   { opacity:0; transform:translateY(-4px); } }

/* ── Photo picker ─────────────────────────────────── */
.photo-row { display: flex; align-items: center; gap: 12px; }
.photo-preview {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--surface2); border: 2px solid var(--border);
  overflow: hidden; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; color: #fff;
}
.photo-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-actions { display: flex; flex-direction: column; gap: 6px; }
.btn-sm { padding: 5px 10px !important; font-size: 12px !important; }

/* ── PDF picker modal ─────────────────────────────── */
#pdf-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.55);
  display: flex; align-items: center; justify-content: center;
  z-index: 950;
  opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
#pdf-overlay.open { opacity: 1; pointer-events: auto; }
.pdf-modal {
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: 0 25px 60px rgba(0,0,0,.22);
  width: min(780px, calc(100vw - 24px));
  max-height: calc(100vh - 48px);
  display: flex; flex-direction: column;
}
.pdf-modal .modal-head { gap: 10px; }
.pdf-nav { display: flex; align-items: center; gap: 6px; margin-left: auto; margin-right: 8px; }
#pdf-page-info { font-size: 12px; color: var(--text-muted); min-width: 80px; text-align: center; }
.pdf-canvas-wrap {
  flex: 1; overflow: auto;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 16px; background: #555;
  position: relative; cursor: crosshair;
  min-height: 200px;
}
#pdf-canvas { display: block; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
#crop-overlay {
  position: absolute;
  border: 2px solid #ef4444;
  background: rgba(239,68,68,.08);
  pointer-events: none;
  display: none;
}
.pdf-modal .modal-foot { align-items: center; }
.pdf-hint { font-size: 12px; color: var(--text-muted); flex: 1; }
#pdf-loading {
  position: absolute; inset: 0;
  display: none; align-items: center; justify-content: center;
  background: rgba(0,0,0,.35); color: #fff; font-size: 14px;
  font-weight: 500; letter-spacing: .02em;
}
#pdf-loading.show { display: flex; }

/* ── Mobile responsive ──────────────────────────────── */
@media (max-width: 640px) {
  #header { padding: 0 10px; gap: 6px; }
  .logo-text { display: none; }
  .btn-label { display: none; }
  .divider   { display: none; }

  .btn        { min-height: 44px; padding: 10px 13px; }
  .btn-icon   { min-width: 44px; min-height: 44px; padding: 10px; }
  .z-btn      { width: 44px; height: 44px; }
  .swatch     { width: 34px; height: 34px; }
  .nc-btn     { width: 36px; height: 36px; }

  .overlay { align-items: flex-end; }
  .modal {
    width: 100%; max-width: 100%;
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
    max-height: 90vh;
    overflow-y: auto;
  }
  .overlay.open .modal { transform: scale(1) translateY(0); }

  .finput, .fselect { font-size: 16px; padding: 10px 12px; }
}
</style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────── -->
<div id="header">
  <div class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="9" y="2" width="6" height="5" rx="1"/>
      <rect x="2" y="15" width="6" height="5" rx="1"/>
      <rect x="9" y="15" width="6" height="5" rx="1"/>
      <rect x="16" y="15" width="6" height="5" rx="1"/>
      <line x1="12" y1="7" x2="12" y2="12"/>
      <line x1="5" y1="15" x2="5" y2="12"/>
      <line x1="12" y1="15" x2="12" y2="12"/>
      <line x1="19" y1="15" x2="19" y2="12"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    <span class="logo-text">OrgChart Maker</span>
  </div>

  <button class="btn btn-primary" onclick="openAdd(null)">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Add Person
  </button>

  <button class="btn btn-secondary" onclick="fitView()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h6M3 3v6M21 3h-6M21 3v6M3 21h6M3 21v-6M21 21h-6M21 21v-6"/></svg>
    <span class="btn-label">Fit</span>
  </button>

  <div class="divider"></div>

  <button class="btn btn-secondary" onclick="doImport()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    <span class="btn-label">Import</span>
  </button>

  <button class="btn btn-secondary" onclick="doExport()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
    <span class="btn-label">Export</span>
  </button>

  <div class="sep"></div>

  <button class="btn btn-ghost btn-icon" onclick="clearAll()" title="Clear chart">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
  </button>
</div>

<!-- ── Canvas ───────────────────────────────────────────────── -->
<div id="canvas-wrap"
     onpointerdown="panStart(event)"
     onpointermove="panMove(event)"
     onpointerup="panEnd(event)"
     onpointercancel="panEnd(event)"
     onwheel="doWheel(event)"
     oncontextmenu="return false">

  <div id="canvas">
    <svg id="svg-layer" width="1" height="1"></svg>
    <div id="nodes-layer"></div>
  </div>

  <div id="empty">
    <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#c1cad6" stroke-width="1.5" style="display:block;margin:0 auto">
      <rect x="9" y="2" width="6" height="5" rx="1"/>
      <rect x="2" y="15" width="6" height="5" rx="1"/>
      <rect x="9" y="15" width="6" height="5" rx="1"/>
      <rect x="16" y="15" width="6" height="5" rx="1"/>
      <line x1="12" y1="7" x2="12" y2="12"/>
      <line x1="5" y1="15" x2="5" y2="12"/>
      <line x1="12" y1="15" x2="12" y2="12"/>
      <line x1="19" y1="15" x2="19" y2="12"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    <h2>No chart yet</h2>
    <p>Click <strong>Add Person</strong> to get started</p>
  </div>

  <div id="zoom-ctrl">
    <button class="z-btn" onclick="zoomBy(1.2)" title="Zoom in">+</button>
    <div id="zoom-pct">100%</div>
    <button class="z-btn" onclick="zoomBy(1/1.2)" title="Zoom out">−</button>
  </div>
</div>

<!-- ── Add / Edit modal ─────────────────────────────────────── -->
<div class="overlay" id="modal-overlay" onmousedown="overlayClick(event)">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-ttl">Add Person</h2>
      <button class="modal-close" onclick="closeModal()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="fg">
        <label class="flabel">Photo <span class="opt">(optional)</span></label>
        <div class="photo-row">
          <div class="photo-preview" id="photo-preview"></div>
          <div class="photo-actions">
            <button type="button" class="btn btn-secondary btn-sm" onclick="triggerImageUpload()">Upload Image</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="triggerPdfPick()">Pick from PDF</button>
            <button type="button" class="btn btn-ghost btn-sm" id="btn-remove-photo" onclick="removePendingPhoto()" style="display:none">Remove Photo</button>
          </div>
        </div>
      </div>
      <div class="fg">
        <label class="flabel">Full Name <span style="color:var(--danger)">*</span></label>
        <input class="finput" id="f-name" placeholder="e.g. Jane Smith" />
      </div>
      <div class="fg">
        <label class="flabel">Job Title <span class="opt">(optional)</span></label>
        <input class="finput" id="f-title" placeholder="e.g. CEO, Senior Engineer" />
      </div>
      <div class="fg">
        <label class="flabel">Department <span class="opt">(optional)</span></label>
        <input class="finput" id="f-dept" placeholder="e.g. Engineering, Marketing" />
      </div>
      <div class="fg">
        <label class="flabel">Reports To <span class="opt">(optional)</span></label>
        <select class="fselect" id="f-parent">
          <option value="">— None (top-level) —</option>
        </select>
      </div>
      <div class="fg">
        <label class="flabel">Color</label>
        <div class="swatches" id="swatches"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNode()">Save Person</button>
    </div>
  </div>
</div>

<!-- ── Context menu ─────────────────────────────────────────── -->
<div id="ctxmenu">
  <div class="cxi" onclick="ctxEdit()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4z"/></svg>
    Edit
  </div>
  <div class="cxi" onclick="ctxAddChild()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Add Direct Report
  </div>
  <div class="cxsep"></div>
  <div class="cxi d" onclick="ctxDelete()">

<script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
  if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  }
</script>

<script>
/* ─────────────────────────────────────────────────────────────
   State
───────────────────────────────────────────────────────────── */
let nodes    = [];
let editId   = null;   // id being edited, null = new
let ctxId    = null;   // id for context menu
let cfCb     = null;   // confirm callback

let pendingPhoto  = null;  // base64 JPEG or null, staged in edit modal
let pdfDoc        = null;  // PDFDocumentProxy
let pdfPageNum    = 1;
let pdfTotalPages = 0;
let cropRect      = null;  // { x, y, w, h } in canvas pixels
let cropStart     = null;  // { x, y } drag origin
let isDragging    = false;

let tx = 0, ty = 0, ts = 1;           // canvas transform
let panning = false;
let ps = { x:0, y:0 }, po = { x:0, y:0 };
let panPointerId = null;
let pinchPointers = new Map();
let pinchDist0 = null, pinchTs0 = null, pinchTx0 = null, pinchTy0 = null;
let longPressTimer = null, longPressId = null;

const CW     = 210;   // card width
const CH     = 110;   // card height estimate for layout
const HGAP   = 50;
const VGAP   = 70;
const PAD    = 60;

const PALETTE = [
  '#4f46e5','#7c3aed','#db2777','#dc2626','#ea580c',
  '#d97706','#16a34a','#0891b2','#0284c7','#64748b'
];

/* ─────────────────────────────────────────────────────────────
   Bootstrap
───────────────────────────────────────────────────────────── */
function init() {
  buildSwatches();
  load();
  render();
  if (nodes.length > 0) setTimeout(fitView, 80);

  const pdfCanvas = document.getElementById('pdf-canvas');
  pdfCanvas.addEventListener('pointerdown', pdfPointerDown);
  pdfCanvas.addEventListener('pointermove', pdfPointerMove);
  pdfCanvas.addEventListener('pointerup',   pdfPointerUp);
}

/* ─────────────────────────────────────────────────────────────
   Layout: Reingold–Tilford inspired simple tree layout
───────────────────────────────────────────────────────────── */
function layoutTree() {
  /* Build adjacency */
  const map  = new Map(nodes.map(n => [n.id, { ...n, kids:[] }]));
  const roots = [];
  for (const n of map.values()) {
    const p = n.parentId && map.get(n.parentId);
    if (p) p.kids.push(n);
    else   roots.push(n);
  }
  if (!roots.length) return {};

  /* Compute subtree widths (post-order) */
  function subtreeW(n) {
    if (!n.kids.length) { n.sw = CW; return CW; }
    let sum = -HGAP;
    for (const k of n.kids) sum += subtreeW(k) + HGAP;
    n.sw = Math.max(CW, sum);
    return n.sw;
  }

  /* Assign x/y (pre-order) */
  function place(n, x, y) {
    n.px = x + n.sw / 2 - CW / 2;
    n.py = y;
    let cx = x;
    for (const k of n.kids) { place(k, cx, y + CH + VGAP); cx += k.sw + HGAP; }
  }

  let rx = PAD;
  for (const r of roots) {
    subtreeW(r);
    place(r, rx, PAD);
    rx += r.sw + HGAP * 2;
  }

  /* Collect */
  const pos = {};
  function collect(n) { pos[n.id] = { x:n.px, y:n.py, kids:n.kids }; n.kids.forEach(collect); }
  roots.forEach(collect);
  return pos;
}

/* ─────────────────────────────────────────────────────────────
   Render
───────────────────────────────────────────────────────────── */
let positions = {};

function render() {
  positions = layoutTree();
  renderNodes();
  renderEdges();
  document.getElementById('empty').style.display = nodes.length ? 'none' : '';
  save();
}

function renderNodes() {
  const layer = document.getElementById('nodes-layer');
  layer.innerHTML = '';

  for (const n of nodes) {
    const p = positions[n.id];
    if (!p) continue;

    const card = document.createElement('div');
    card.className = 'nc';
    card.id = 'nc-' + n.id;
    card.style.cssText = `left:${p.x}px;top:${p.y}px`;

    const deptBg = n.color + '1a';
    card.innerHTML = `
      <div class="nc-bar" style="background:${n.color}"></div>
      <div class="nc-body">
        <div class="nc-avatar" style="background:${n.photo ? 'transparent' : n.color}">
          ${n.photo
            ? `<img src="${n.photo}" style="width:38px;height:38px;border-radius:50%;object-fit:cover;display:block" alt="">`
            : initials(n.name)}
        </div>
        <div class="nc-info">
          <div class="nc-name">${esc(n.name)}</div>
          ${n.title ? `<div class="nc-title">${esc(n.title)}</div>` : ''}
          ${n.dept  ? `<div class="nc-dept" style="background:${deptBg};color:${n.color}">${esc(n.dept)}</div>` : ''}
        </div>
      </div>
      <div class="nc-actions">
        <button class="nc-btn add"    title="Add direct report" onclick="openAdd('${n.id}');event.stopPropagation()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="nc-btn"        title="Edit"              onclick="openEdit('${n.id}');event.stopPropagation()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4z"/></svg>
        </button>
        <button class="nc-btn danger" title="Delete"            onclick="askDelete('${n.id}');event.stopPropagation()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
        </button>
      </div>`;

    card.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); showCtx(e, n.id); });

    // Long-press context menu for touch devices
    let lpTimer = null;
    card.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'touch') return;
      lpTimer = setTimeout(() => { showCtx(e, n.id); navigator.vibrate && navigator.vibrate(40); }, 500);
    });
    ['pointermove', 'pointerup', 'pointercancel'].forEach(ev =>
      card.addEventListener(ev, () => { clearTimeout(lpTimer); lpTimer = null; })
    );

    layer.appendChild(card);
  }
  resizeSvg();
}

function renderEdges() {
  const svg = document.getElementById('svg-layer');
  svg.querySelectorAll('.conn').forEach(e => e.remove());

  for (const n of nodes) {
    if (!n.parentId) continue;
    const pp = positions[n.parentId];
    const cp = positions[n.id];
    if (!pp || !cp) continue;

    const x1 = pp.x + CW / 2, y1 = pp.y + CH;
    const x2 = cp.x + CW / 2, y2 = cp.y;
    const my = (y1 + y2) / 2;

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);
    path.setAttribute('class','conn');
    svg.appendChild(path);
  }
}

function resizeSvg() {
  const svg = document.getElementById('svg-layer');
  const ps  = Object.values(positions);
  if (!ps.length) { svg.setAttribute('width','1'); svg.setAttribute('height','1'); return; }
  const W = Math.max(...ps.map(p => p.x)) + CW  + PAD;
  const H = Math.max(...ps.map(p => p.y)) + CH  + PAD;
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
}

/* ─────────────────────────────────────────────────────────────
   Pan & Zoom
───────────────────────────────────────────────────────────── */
function applyT() {
  document.getElementById('canvas').style.transform = `translate(${tx}px,${ty}px) scale(${ts})`;
  document.getElementById('zoom-pct').textContent = Math.round(ts * 100) + '%';
}

function panStart(e) {
  const wrap = document.getElementById('canvas-wrap');
  const tgt  = e.target;
  const onBg = tgt === wrap || tgt.id === 'canvas' || tgt.id === 'svg-layer' || tgt.id === 'nodes-layer';

  pinchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pinchPointers.size === 2) {
    // Transition to pinch-zoom: cancel any active pan
    panning = false;
    wrap.classList.remove('panning');
    const pts = [...pinchPointers.values()];
    const dx = pts[1].x - pts[0].x, dy = pts[1].y - pts[0].y;
    pinchDist0 = Math.hypot(dx, dy);
    pinchTs0 = ts; pinchTx0 = tx; pinchTy0 = ty;
  } else if (onBg) {
    panning = true;
    panPointerId = e.pointerId;
    ps = { x: e.clientX, y: e.clientY };
    po = { x: tx, y: ty };
    wrap.classList.add('panning');
    wrap.setPointerCapture(e.pointerId);
    hideCtx();
  }
}
function panMove(e) {
  pinchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pinchPointers.size >= 2 && pinchDist0 !== null) {
    const pts = [...pinchPointers.values()];
    const dx = pts[1].x - pts[0].x, dy = pts[1].y - pts[0].y;
    const dist = Math.hypot(dx, dy);
    const f  = dist / pinchDist0;
    const mx = (pts[0].x + pts[1].x) / 2;
    const my = (pts[0].y + pts[1].y) / 2;
    const r  = document.getElementById('canvas-wrap').getBoundingClientRect();
    const cx = mx - r.left, cy = my - r.top;
    ts = Math.min(3, Math.max(.15, pinchTs0 * f));
    const actualF = ts / pinchTs0;
    tx = cx - (cx - pinchTx0) * actualF;
    ty = cy - (cy - pinchTy0) * actualF;
    applyT();
    return;
  }

  if (!panning || e.pointerId !== panPointerId) return;
  tx = po.x + e.clientX - ps.x;
  ty = po.y + e.clientY - ps.y;
  applyT();
}
function panEnd(e) {
  pinchPointers.delete(e.pointerId);

  if (pinchPointers.size < 2) {
    pinchDist0 = null;
    if (pinchPointers.size === 1) {
      // One finger remains after pinch — re-enter pan mode for that finger
      const [id, pos] = [...pinchPointers.entries()][0];
      panning = true;
      panPointerId = id;
      ps = pos;
      po = { x: tx, y: ty };
      document.getElementById('canvas-wrap').classList.add('panning');
      return;
    }
  }

  if (e.pointerId === panPointerId) {
    panning = false;
    panPointerId = null;
    document.getElementById('canvas-wrap').classList.remove('panning');
  }
}
function doWheel(e) {
  e.preventDefault();
  const f   = e.deltaY > 0 ? 1/1.1 : 1.1;
  const r   = document.getElementById('canvas-wrap').getBoundingClientRect();
  const mx  = e.clientX - r.left, my = e.clientY - r.top;
  tx = mx - (mx - tx) * f;
  ty = my - (my - ty) * f;
  ts = Math.min(3, Math.max(.15, ts * f));
  applyT();
}
function zoomBy(f) {
  const r  = document.getElementById('canvas-wrap');
  const cx = r.clientWidth / 2, cy = r.clientHeight / 2;
  tx = cx - (cx - tx) * f;
  ty = cy - (cy - ty) * f;
  ts = Math.min(3, Math.max(.15, ts * f));
  applyT();
}
function fitView() {
  if (!nodes.length) return;
  const ps = Object.values(positions);
  if (!ps.length) return;
  const r   = document.getElementById('canvas-wrap');
  const mnX = Math.min(...ps.map(p=>p.x));
  const mnY = Math.min(...ps.map(p=>p.y));
  const mxX = Math.max(...ps.map(p=>p.x)) + CW;
  const mxY = Math.max(...ps.map(p=>p.y)) + CH;
  const cW  = mxX - mnX + PAD * 2;
  const cH  = mxY - mnY + PAD * 2;
  ts = Math.min(r.clientWidth / cW, r.clientHeight / cH, 1.4);
  tx = (r.clientWidth  - cW * ts) / 2 - mnX * ts + PAD * ts;
  ty = (r.clientHeight - cH * ts) / 2 - mnY * ts + PAD * ts;
  applyT();
}

/* ─────────────────────────────────────────────────────────────
   Add / Edit modal
───────────────────────────────────────────────────────────── */
function openAdd(parentId) {
  editId = null;
  document.getElementById('modal-ttl').textContent = 'Add Person';
  document.getElementById('f-name').value  = '';
  document.getElementById('f-title').value = '';
  document.getElementById('f-dept').value  = '';
  populateParent(null, parentId);
  pickColor(PALETTE[Math.floor(Math.random() * PALETTE.length)]);
  loadPhotoIntoModal(null);
  showModal();
  setTimeout(() => document.getElementById('f-name').focus(), 80);
}

function openEdit(id) {
  const n = nodes.find(x => x.id === id);
  if (!n) return;
  editId = id;
  document.getElementById('modal-ttl').textContent = 'Edit Person';
  document.getElementById('f-name').value  = n.name;
  document.getElementById('f-title').value = n.title || '';
  document.getElementById('f-dept').value  = n.dept  || '';
  populateParent(id, n.parentId);
  pickColor(n.color);
  loadPhotoIntoModal(n);
  showModal();
}

function populateParent(excludeId, selectedId) {
  const sel = document.getElementById('f-parent');
  sel.innerHTML = '<option value="">— None (top-level) —</option>';

  /* collect descendants of excludeId to prevent cycles */
  const excl = new Set();
  if (excludeId) {
    excl.add(excludeId);
    const addDesc = id => nodes.filter(n=>n.parentId===id).forEach(n => { excl.add(n.id); addDesc(n.id); });
    addDesc(excludeId);
  }

  for (const n of nodes) {
    if (excl.has(n.id)) continue;
    const o = document.createElement('option');
    o.value = n.id;
    o.textContent = n.name + (n.title ? ` — ${n.title}` : '');
    if (n.id === selectedId) o.selected = true;
    sel.appendChild(o);
  }
}

function showModal()  { document.getElementById('modal-overlay').classList.add('open'); }
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function overlayClick(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }

function saveNode() {
  const nameEl = document.getElementById('f-name');
  const name   = nameEl.value.trim();
  if (!name) { nameEl.classList.add('error'); nameEl.focus(); setTimeout(()=>nameEl.classList.remove('error'), 1500); return; }

  const data = {
    name,
    title:    document.getElementById('f-title').value.trim(),
    dept:     document.getElementById('f-dept').value.trim(),
    parentId: document.getElementById('f-parent').value || null,
    color:    document.querySelector('.swatch.active')?.dataset.c || PALETTE[0],
    photo:    pendingPhoto
  };

  if (editId) {
    const i = nodes.findIndex(n=>n.id===editId);
    if (i !== -1) nodes[i] = { ...nodes[i], ...data };
    toast('Changes saved');
  } else {
    nodes.push({ id: uid(), ...data });
    toast('Person added');
  }

  closeModal();
  render();
}

/* ─────────────────────────────────────────────────────────────
   Swatches
───────────────────────────────────────────────────────────── */
function buildSwatches() {
  const box = document.getElementById('swatches');
  box.innerHTML = '';
  for (const c of PALETTE) {
    const s = document.createElement('div');
    s.className = 'swatch';
    s.dataset.c = c;
    s.style.background = c;
    s.onclick = () => pickColor(c);
    box.appendChild(s);
  }
}
function pickColor(c) {
  document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.c === c));
}

/* ─────────────────────────────────────────────────────────────
   Delete
───────────────────────────────────────────────────────────── */
function askDelete(id) {
  const n = nodes.find(x=>x.id===id);
  if (!n) return;
  const children = nodes.filter(x=>x.parentId===id).length;
  showConfirm(
    `Delete "${n.name}"?`,
    children
      ? `This person has ${children} direct report${children>1?'s':''}. They will be reassigned to ${n.parentId ? 'their grandparent' : 'top level'}.`
      : 'This action cannot be undone.',
    () => {
      nodes.filter(x=>x.parentId===id).forEach(x => x.parentId = n.parentId);
      nodes = nodes.filter(x=>x.id!==id);
      render();
      toast('Person deleted');
    }
  );
}

/* ─────────────────────────────────────────────────────────────
   Context menu
───────────────────────────────────────────────────────────── */
function showCtx(e, id) {
  ctxId = id;
  const m = document.getElementById('ctxmenu');
  m.style.left = e.clientX + 'px';
  m.style.top  = e.clientY + 'px';
  m.classList.add('open');
  const r = m.getBoundingClientRect();
  if (r.right  > innerWidth)  m.style.left = (e.clientX - r.width)  + 'px';
  if (r.bottom > innerHeight) m.style.top  = (e.clientY - r.height) + 'px';
}
function hideCtx() { document.getElementById('ctxmenu').classList.remove('open'); ctxId = null; }
function ctxEdit()     { const id=ctxId; hideCtx(); openEdit(id); }
function ctxAddChild() { const id=ctxId; hideCtx(); openAdd(id);  }
function ctxDelete()   { const id=ctxId; hideCtx(); askDelete(id);}

/* ─────────────────────────────────────────────────────────────
   Confirm dialog
───────────────────────────────────────────────────────────── */
function showConfirm(title, msg, cb) {
  document.getElementById('cf-title').textContent = title;
  document.getElementById('cf-msg').textContent   = msg;
  document.getElementById('confirm').classList.add('open');
  cfCb = cb;
}
function closeConfirm(ok) {
  document.getElementById('confirm').classList.remove('open');
  if (ok && cfCb) cfCb();
  cfCb = null;
}

/* ─────────────────────────────────────────────────────────────
   Clear all
───────────────────────────────────────────────────────────── */
function clearAll() {
  if (!nodes.length) return;
  showConfirm('Clear all?', 'All nodes will be permanently deleted.', () => {
    nodes = [];
    render();
    toast('Chart cleared');
  });
}

/* ─────────────────────────────────────────────────────────────
   Persist (localStorage)
───────────────────────────────────────────────────────────── */
const KEY = 'orgchart_v1';
function save() { try { localStorage.setItem(KEY, JSON.stringify(nodes)); } catch(_) {} }
function load() { try { const d = localStorage.getItem(KEY); if (d) nodes = JSON.parse(d); } catch(_) { nodes = []; } }

/* ─────────────────────────────────────────────────────────────
   Export / Import JSON
───────────────────────────────────────────────────────────── */
function doExport() {
  if (!nodes.length) { toast('Nothing to export'); return; }
  const blob = new Blob([JSON.stringify(nodes, null, 2)], { type:'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { href:url, download:'orgchart.json' });
  a.click();
  URL.revokeObjectURL(url);
  toast('Chart exported');
}
function doImport() { document.getElementById('file-in').click(); }
function onFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data)) throw 0;
      nodes = data;
      render();
      setTimeout(fitView, 80);
      toast(`Imported ${nodes.length} person${nodes.length!==1?'s':''}`);
    } catch(_) { toast('Invalid JSON file'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ─────────────────────────────────────────────────────────────
   Toast
───────────────────────────────────────────────────────────── */
function toast(msg) {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

/* ─────────────────────────────────────────────────────────────
   Keyboard shortcuts
───────────────────────────────────────────────────────────── */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('pdf-overlay').classList.contains('open')) {
      closePdfModal();
    } else {
      closeModal(); hideCtx(); closeConfirm(false);
    }
  }
  if (e.key === 'Enter' && document.getElementById('modal-overlay').classList.contains('open')) saveNode();
  if ((e.key === '+' || e.key === '=') && !e.target.matches('input,select,textarea')) zoomBy(1.15);
  if ((e.key === '-')                  && !e.target.matches('input,select,textarea')) zoomBy(1/1.15);
  if (e.key === '0'                    && !e.target.matches('input,select,textarea')) fitView();
});

document.addEventListener('click', e => {
  if (!e.target.closest('#ctxmenu')) hideCtx();
});

/* ─────────────────────────────────────────────────────────────
   Utilities
───────────────────────────────────────────────────────────── */
function uid() { return Math.random().toString(36).slice(2,9) + Date.now().toString(36); }
function initials(s) { return s.trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function esc(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ─────────────────────────────────────────────────────────────
   Photo management
───────────────────────────────────────────────────────────── */
function resizePhoto(source, maxPx = 96, quality = 0.72) {
  const sw = source instanceof HTMLCanvasElement ? source.width  : (source.naturalWidth  || source.width);
  const sh = source instanceof HTMLCanvasElement ? source.height : (source.naturalHeight || source.height);
  const size = Math.min(sw, sh);
  const sx = (sw - size) / 2, sy = (sh - size) / 2;
  const off = document.createElement('canvas');
  off.width = off.height = maxPx;
  off.getContext('2d').drawImage(source, sx, sy, size, size, 0, 0, maxPx, maxPx);
  return off.toDataURL('image/jpeg', quality);
}

function updatePhotoPreview() {
  const preview   = document.getElementById('photo-preview');
  const removeBtn = document.getElementById('btn-remove-photo');
  if (pendingPhoto) {
    preview.innerHTML = `<img src="${pendingPhoto}" alt="">`;
    preview.style.background = 'transparent';
    removeBtn.style.display = '';
  } else {
    preview.innerHTML = '';
    const name  = document.getElementById('f-name').value.trim();
    const color = document.querySelector('.swatch.active')?.dataset.c || PALETTE[0];
    preview.style.background = color;
    preview.textContent = name ? initials(name) : '?';
    removeBtn.style.display = 'none';
  }
}

function loadPhotoIntoModal(node) {
  pendingPhoto = node ? (node.photo || null) : null;
  updatePhotoPreview();
}

function triggerImageUpload() { document.getElementById('img-in').click(); }

function onImageFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => { pendingPhoto = resizePhoto(img); updatePhotoPreview(); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function removePendingPhoto() { pendingPhoto = null; updatePhotoPreview(); }

/* ─────────────────────────────────────────────────────────────
   PDF photo picker
───────────────────────────────────────────────────────────── */
function triggerPdfPick() {
  if (typeof pdfjsLib === 'undefined') {
    toast('PDF support requires an internet connection');
    return;
  }
  document.getElementById('pdf-in').click();
}

async function onPdfFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = '';

  const overlay = document.getElementById('pdf-overlay');
  overlay.classList.add('open');
  setLoading(true);

  try {
    const buf = await file.arrayBuffer();
    if (pdfDoc) { pdfDoc.destroy(); pdfDoc = null; }
    pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
    pdfTotalPages = pdfDoc.numPages;
    await renderPdfPage(1);
  } catch(_) {
    overlay.classList.remove('open');
    toast('Could not load PDF');
  } finally {
    setLoading(false);
  }
}

async function renderPdfPage(pageNum) {
  setLoading(true);
  cropRect = null;
  document.getElementById('crop-overlay').style.display = 'none';
  document.getElementById('btn-use-sel').disabled = true;

  const page      = await pdfDoc.getPage(pageNum);
  const vp0       = page.getViewport({ scale: 1 });
  const scale     = Math.min(700 / vp0.width, 860 / vp0.height, 2);
  const viewport  = page.getViewport({ scale });

  const canvas    = document.getElementById('pdf-canvas');
  canvas.width    = viewport.width;
  canvas.height   = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

  pdfPageNum = pageNum;
  document.getElementById('pdf-page-info').textContent = `Page ${pageNum} / ${pdfTotalPages}`;
  setLoading(false);
}

function pdfPrevPage() { if (pdfPageNum > 1) renderPdfPage(pdfPageNum - 1); }
function pdfNextPage() { if (pdfPageNum < pdfTotalPages) renderPdfPage(pdfPageNum + 1); }

function setLoading(on) {
  document.getElementById('pdf-loading').classList.toggle('show', on);
  document.getElementById('pdf-prev').disabled = on || pdfPageNum <= 1;
  document.getElementById('pdf-next').disabled = on || pdfPageNum >= pdfTotalPages;
}

function pdfPointerDown(e) {
  e.preventDefault();
  const rect = document.getElementById('pdf-canvas').getBoundingClientRect();
  cropStart  = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  isDragging = true;
  cropRect   = null;
  document.getElementById('crop-overlay').style.display = 'none';
  document.getElementById('btn-use-sel').disabled = true;
  e.target.setPointerCapture(e.pointerId);
}

function pdfPointerMove(e) {
  if (!isDragging || !cropStart) return;
  const canvas    = document.getElementById('pdf-canvas');
  const canvasRect = canvas.getBoundingClientRect();
  const wrap      = document.getElementById('pdf-canvas-wrap');
  const wrapRect  = wrap.getBoundingClientRect();

  const curX = Math.max(0, Math.min(e.clientX - canvasRect.left, canvas.width));
  const curY = Math.max(0, Math.min(e.clientY - canvasRect.top,  canvas.height));
  const x = Math.min(cropStart.x, curX), y = Math.min(cropStart.y, curY);
  const w = Math.abs(curX - cropStart.x), h = Math.abs(curY - cropStart.y);

  const ov = document.getElementById('crop-overlay');
  ov.style.left    = (canvasRect.left - wrapRect.left + wrap.scrollLeft + x) + 'px';
  ov.style.top     = (canvasRect.top  - wrapRect.top  + wrap.scrollTop  + y) + 'px';
  ov.style.width   = w + 'px';
  ov.style.height  = h + 'px';
  ov.style.display = (w > 3 && h > 3) ? 'block' : 'none';
}

function pdfPointerUp(e) {
  if (!isDragging) return;
  isDragging = false;
  const canvas    = document.getElementById('pdf-canvas');
  const canvasRect = canvas.getBoundingClientRect();

  const curX = Math.max(0, Math.min(e.clientX - canvasRect.left, canvas.width));
  const curY = Math.max(0, Math.min(e.clientY - canvasRect.top,  canvas.height));
  const x = Math.min(cropStart.x, curX), y = Math.min(cropStart.y, curY);
  const w = Math.abs(curX - cropStart.x), h = Math.abs(curY - cropStart.y);

  if (w > 5 && h > 5) {
    cropRect = { x, y, w, h };
    document.getElementById('btn-use-sel').disabled = false;
  }
}

function useSelection() {
  if (!cropRect) return;
  const canvas = document.getElementById('pdf-canvas');
  const off    = document.createElement('canvas');
  off.width    = cropRect.w;
  off.height   = cropRect.h;
  off.getContext('2d').drawImage(canvas, cropRect.x, cropRect.y, cropRect.w, cropRect.h, 0, 0, cropRect.w, cropRect.h);
  pendingPhoto = resizePhoto(off);
  closePdfModal();
  updatePhotoPreview();
}

function closePdfModal() {
  document.getElementById('pdf-overlay').classList.remove('open');
  if (pdfDoc) { pdfDoc.destroy(); pdfDoc = null; }
  cropRect = null; cropStart = null; isDragging = false;
}

/* ── Start ── */
init();
</script>
